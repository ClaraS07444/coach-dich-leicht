# Lädt die Website bei jedem Push auf "main" automatisch zu SiteGround hoch.
#
# Einmalig einrichten (Repository → Settings → Secrets and variables → Actions):
#   Secrets:   SSH_HOST         z. B. ssh.coachdichleicht.de (aus SiteGround → Devs → SSH-Schlüssel-Manager)
#              SSH_PORT         bei SiteGround 18765
#              SSH_USER         SSH-Benutzername aus SiteGround (z. B. u123-abc…)
#              SSH_PRIVATE_KEY  privater Schlüssel (ohne Passphrase), öffentlicher Teil ist in SiteGround importiert
#              SSH_REMOTE_PATH  z. B. www/coachdichleicht.de/public_html/
#   Variable:  DEPLOY_ENABLED = true
#
# Solange DEPLOY_ENABLED nicht auf "true" steht, wird nichts hochgeladen.
# So kann die alte WordPress-Seite nicht versehentlich überschrieben werden,
# bevor ein Backup existiert.

name: Deploy zu SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: SSH vorbereiten
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Website hochladen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
        run: |
          rsync -rlvz --delete --checksum \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'archiv/' \
            --exclude '.DS_Store' \
            --exclude 'README*' \
            --filter 'protect .well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$SSH_REMOTE_PATH"

      - name: Prüfen, ob die Seite erreichbar ist
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://coachdichleicht.de/)
          echo "Startseite antwortet mit HTTP $code"
          test "$code" = "200"
